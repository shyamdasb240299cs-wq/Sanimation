<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIDY / Character atelier</title><style>*{box-sizing:border-box}body{margin:0;background:#101b29;color:#ecede7;font:15px system-ui}header{padding:24px 4vw;border-bottom:1px solid #354255}h1{margin:6px 0;font-size:30px}small{color:#9aafbd;letter-spacing:2px}main{display:grid;grid-template-columns:260px minmax(300px,1fr) 260px;gap:24px;padding:24px 4vw}button,select,input{font:inherit}button,select{background:#233346;color:#f4f0e4;border:1px solid #45556b;border-radius:8px;padding:10px;cursor:pointer}nav{display:flex;flex-direction:column;gap:6px;max-height:78vh;overflow:auto}nav button{text-align:left}nav button.active{background:#ac2d43}canvas{width:100%;max-height:75vh;object-fit:contain}label{display:block;margin:18px 0 7px;color:#aebecb}select{width:100%}aside p{line-height:1.6;color:#aebecb}.buttons{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){main{grid-template-columns:1fr}nav{max-height:200px}canvas{height:65vh}} </style><header><small>BRAIN DECOY / CAST DEVELOPMENT / 01</small><h1>SPIDY — Character atelier</h1><span>21 cast entries · expressive faces · deterministic motion · transparent exports</span></header><main><nav id="cast"></nav><section><canvas id="c" width="1080" height="1600"></canvas></section><aside><h2 id="name"></h2><p id="role"></p><label>Expression</label><select id="expression"></select><label>Motion study</label><select id="action"></select><label>Head turn</label><input id="facing" type="range" min="-1" max="1" step=".01" value="0"><label>Wrist devices</label><select id="shooters"><option value="none">None · first jump</option><option value="full">Full · training</option><option value="empty">Empty · rescue</option></select><label>Framing</label><select id="shot"><option>full</option><option>portrait</option></select><p>Head turns are stylized ¾ studies. Motion samples are reusable rig studies, not finished film choreography.</p><div class="buttons"><button id="pause">Pause</button><button id="export">Export PNG</button></div></aside></main><script type="module" src="app.js"></script></html>
